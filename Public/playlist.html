<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SujalConnect — Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   SujalConnect — Playlist Player
   Matches the design system used across the app.
   ========================================================================== */
:root{
  --bg-0:#000000;
  --bg-1:#0a0a0a;
  --bg-2:#121212;
  --bg-3:#181818;
  --bg-4:#202020;
  --bg-hover:#282828;
  --bg-elevated:#242424;
  --accent:#1ed760;
  --accent-hover:#22e065;
  --accent-dark:#169c46;
  --text-primary:#ffffff;
  --text-secondary:#b3b3b3;
  --text-tertiary:#727272;
  --border:rgba(255,255,255,0.08);
  --danger:#f15e6c;
  --shadow-lg: 0 16px 40px rgba(0,0,0,.5);
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --player-h:92px;
  --topbar-h:64px;
  --ease: cubic-bezier(.4,0,.2,1);
  --cover-accent:#1ed760;
  --cover-accent-2:#0a5c2a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg-0);
  color:var(--text-primary);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:12px;height:12px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px;border:3px solid transparent;background-clip:content-box;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.3);background-clip:content-box;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit;}
input,textarea{font-family:inherit;outline:none;border:none;}
img{-webkit-user-drag:none;user-select:none;}
.hidden{display:none !important;}
.flex{display:flex;}

@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes floatIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes barBounce{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(30,215,96,.45)}50%{box-shadow:0 0 0 12px rgba(30,215,96,0)}}
@keyframes toastIn{from{opacity:0;transform:translateY(20px) translateX(-50%)}to{opacity:1;transform:translateY(0) translateX(-50%)}}
@keyframes rotateCover{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes heroGradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes popIn{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes likeBurst{0%{transform:scale(.3);opacity:1}70%{transform:scale(1.4);opacity:.5}100%{transform:scale(1.8);opacity:0}}
@keyframes rowSlideIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@keyframes vinylSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes waveMove{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

.skeleton{
  background:linear-gradient(90deg,var(--bg-3) 25%,var(--bg-4) 37%,var(--bg-3) 63%);
  background-size:400px 100%;
  animation:shimmer 1.4s ease-in-out infinite;
}

/* ---------------- App shell ---------------- */
#app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* ---------------- Topbar ---------------- */
.topbar{
  height:var(--topbar-h);
  min-height:var(--topbar-h);
  display:flex;
  align-items:center;
  gap:14px;
  padding:0 20px;
  background:rgba(10,10,10,.7);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  z-index:40;
}
.nav-btn{
  width:32px;height:32px;border-radius:50%;
  background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  transition:background .2s var(--ease), transform .15s var(--ease);
}
.nav-btn:hover{background:rgba(0,0,0,.85);transform:scale(1.06);}
.nav-btn svg{width:20px;height:20px;fill:var(--text-primary);}
.topbar-title{
  font-size:14px;font-weight:700;color:var(--text-secondary);
  flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.icon-btn{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  transition:color .15s var(--ease), background .15s var(--ease), transform .15s var(--ease);
}
.icon-btn:hover{color:var(--text-primary);background:var(--bg-hover);transform:scale(1.06);}
.icon-btn svg{width:18px;height:18px;fill:currentColor;}

.new-playlist-btn{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;
  border-radius:999px;
  background:var(--bg-4);
  font-weight:700;font-size:13px;
  transition:background .18s var(--ease), transform .15s var(--ease);
}
.new-playlist-btn:hover{background:var(--bg-hover);transform:translateY(-1px);}
.new-playlist-btn svg{width:16px;height:16px;fill:currentColor;}

/* ---------------- Main layout ---------------- */
.main-layout{
  flex:1;
  display:flex;
  overflow:hidden;
}

/* ---------------- Sidebar: playlist list ---------------- */
.sidebar{
  width:300px;
  min-width:300px;
  background:var(--bg-1);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:14px 8px 8px;
  overflow:hidden;
}
.sidebar-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:4px 10px 12px;
}
.sidebar-head h2{font-size:16px;font-weight:800;letter-spacing:.2px;}
.sidebar-list{
  flex:1;
  overflow-y:auto;
  display:flex;flex-direction:column;
  gap:2px;
  padding-bottom:12px;
}
.pl-item{
  display:flex;align-items:center;gap:12px;
  padding:8px 10px;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:background .15s var(--ease);
  animation:rowSlideIn .35s var(--ease) both;
  position:relative;
}
.pl-item:hover{background:var(--bg-3);}
.pl-item.active{background:var(--bg-elevated);}
.pl-item.active::before{
  content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
  background:var(--accent);border-radius:0 4px 4px 0;
}
.pl-thumb{
  width:46px;height:46px;border-radius:6px;
  background:linear-gradient(135deg,var(--bg-4),var(--bg-2));
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;
  box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.pl-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.pl-thumb svg{width:20px;height:20px;fill:var(--text-tertiary);}
.pl-meta{min-width:0;flex:1;}
.pl-name{
  font-size:14px;font-weight:600;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.pl-sub{font-size:12px;color:var(--text-tertiary);margin-top:2px;}
.pl-item-menu{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);
  opacity:0;
  transition:opacity .15s var(--ease), background .15s var(--ease), color .15s var(--ease);
}
.pl-item:hover .pl-item-menu{opacity:1;}
.pl-item-menu:hover{background:var(--bg-hover);color:var(--text-primary);}
.pl-item-menu svg{width:16px;height:16px;fill:currentColor;}

.empty-sidebar{
  padding:30px 14px;text-align:center;color:var(--text-tertiary);font-size:13px;
  line-height:1.6;
}

/* ---------------- Content area ---------------- */
.content{
  flex:1;
  overflow-y:auto;
  position:relative;
  background:linear-gradient(180deg, var(--hero-c1,#2a3f2f) 0%, var(--bg-1) 320px, var(--bg-1) 100%);
}
.content-inner{
  padding-bottom:140px;
}

/* Hero */
.pl-hero{
  display:flex;align-items:flex-end;gap:26px;
  padding:60px 32px 26px;
  min-height:280px;
  position:relative;
}
.pl-hero-cover{
  width:220px;height:220px;border-radius:10px;
  box-shadow:0 22px 50px rgba(0,0,0,.6);
  flex-shrink:0;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  animation:floatIn .5s var(--ease) both;
}
.pl-hero-cover .cover-grid{
  width:100%;height:100%;
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
}
.pl-hero-cover .cover-grid img{width:100%;height:100%;object-fit:cover;display:block;}
.pl-hero-cover .cover-fallback{
  width:100%;height:100%;
  background:linear-gradient(135deg,var(--cover-accent),var(--cover-accent-2));
  background-size:200% 200%;
  animation:heroGradientShift 6s ease infinite;
  display:flex;align-items:center;justify-content:center;
}
.pl-hero-cover .cover-fallback svg{width:70px;height:70px;fill:rgba(255,255,255,.85);}
.pl-hero-info{
  display:flex;flex-direction:column;gap:10px;
  padding-bottom:6px;
  animation:slideUp .5s var(--ease) both;
  animation-delay:.05s;
  min-width:0;
}
.pl-hero-type{font-size:13px;font-weight:700;letter-spacing:.3px;}
.pl-hero-title{
  font-size:56px;font-weight:900;line-height:1.05;
  letter-spacing:-1.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  cursor:text;
  outline:none;
}
.pl-hero-title:focus{
  text-decoration:underline;
}
@media (max-width:900px){ .pl-hero-title{font-size:34px;} }
.pl-hero-desc{
  font-size:14px;color:var(--text-secondary);
  max-width:600px;
}
.pl-hero-sub{
  display:flex;align-items:center;gap:6px;
  font-size:14px;color:var(--text-secondary);flex-wrap:wrap;
}
.pl-hero-sub b{color:var(--text-primary);font-weight:700;}
.dot{width:3px;height:3px;border-radius:50%;background:var(--text-tertiary);}

/* Action bar */
.pl-actionbar{
  display:flex;align-items:center;gap:24px;
  padding:20px 32px 8px;
  background:linear-gradient(180deg, rgba(0,0,0,.25), transparent);
}
.play-fab{
  width:58px;height:58px;border-radius:50%;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 22px rgba(30,215,96,.35);
  transition:transform .16s var(--ease), background .16s var(--ease);
}
.play-fab:hover{transform:scale(1.06);background:var(--accent-hover);}
.play-fab:active{transform:scale(.96);}
.play-fab svg{width:26px;height:26px;fill:#000;margin-left:2px;}
.play-fab.playing svg{margin-left:0;}
.pl-action-icon{
  width:34px;height:34px;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-secondary);
  transition:color .15s var(--ease), transform .15s var(--ease);
}
.pl-action-icon:hover{color:var(--text-primary);transform:scale(1.08);}
.pl-action-icon.liked{color:var(--accent);}
.pl-action-icon svg{width:24px;height:24px;fill:currentColor;}
.pl-action-icon.small svg{width:20px;height:20px;}

/* Search / add */
.pl-add-row{
  display:flex;align-items:center;gap:10px;
  margin:8px 32px 0;
  position:relative;
}
.pl-search-wrap{
  flex:1;position:relative;max-width:420px;
}
.pl-search-wrap svg.search-icon{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;fill:var(--text-tertiary);pointer-events:none;
}
.pl-search-input{
  width:100%;
  background:var(--bg-3);
  border:1px solid transparent;
  border-radius:999px;
  padding:10px 14px 10px 36px;
  font-size:14px;color:var(--text-primary);
  transition:border-color .15s var(--ease), background .15s var(--ease);
}
.pl-search-input::placeholder{color:var(--text-tertiary);}
.pl-search-input:focus{background:var(--bg-4);border-color:rgba(255,255,255,.25);}

.search-results-drop{
  position:absolute;top:calc(100% + 8px);left:0;right:0;
  max-width:420px;
  background:var(--bg-elevated);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);
  border:1px solid var(--border);
  max-height:340px;overflow-y:auto;
  z-index:50;
  animation:fadeInScale .16s var(--ease) both;
}
.sr-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;cursor:pointer;
  transition:background .12s var(--ease);
}
.sr-item:hover{background:var(--bg-hover);}
.sr-item img{width:36px;height:36px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--bg-4);}
.sr-item .sr-meta{min-width:0;flex:1;}
.sr-item .sr-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-item .sr-artist{font-size:12px;color:var(--text-tertiary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sr-add-icon{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);flex-shrink:0;}
.sr-add-icon svg{width:16px;height:16px;fill:currentColor;}
.sr-item.added .sr-add-icon{color:var(--accent);}
.sr-empty,.sr-loading{padding:16px;text-align:center;color:var(--text-tertiary);font-size:13px;}

/* ---------------- Track table ---------------- */
.track-table{
  margin:20px 32px 0;
}
.tt-head{
  display:grid;
  grid-template-columns:36px 1fr 160px 90px 44px;
  gap:14px;
  padding:0 12px 8px;
  border-bottom:1px solid var(--border);
  font-size:12px;color:var(--text-tertiary);
  text-transform:uppercase;letter-spacing:.5px;
  position:sticky;top:0;
}
.tt-head span:nth-child(3),.tt-head span:nth-child(4){text-align:left;}
.tt-body{padding-top:6px;}

.track-row{
  display:grid;
  grid-template-columns:36px 1fr 160px 90px 44px;
  gap:14px;
  align-items:center;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
  transition:background .13s var(--ease);
  animation:rowSlideIn .3s var(--ease) both;
  position:relative;
}
.track-row:hover{background:rgba(255,255,255,.06);}
.track-row.active .tt-title{color:var(--accent);}
.track-row.active .tt-index-num{color:var(--accent);}
.tt-index{
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:var(--text-tertiary);
  position:relative;width:20px;
}
.tt-index-num{font-variant-numeric:tabular-nums;}
.tt-index .tt-play-icon,.tt-index .tt-eq{display:none;}
.track-row:hover .tt-index-num{display:none;}
.track-row:hover .tt-play-icon{display:flex;}
.tt-play-icon{
  width:16px;height:16px;align-items:center;justify-content:center;
}
.tt-play-icon svg{width:14px;height:14px;fill:var(--text-primary);}
.track-row.active .tt-index-num{display:none;}
.track-row.active .tt-eq{display:flex;align-items:flex-end;gap:2px;height:14px;}
.track-row.active:hover .tt-eq{display:none;}
.track-row.active:hover .tt-play-icon{display:flex;}
.eq-bar{width:3px;background:var(--accent);border-radius:1px;animation:barBounce .9s ease-in-out infinite;}
.eq-bar:nth-child(2){animation-delay:.2s;}
.eq-bar:nth-child(3){animation-delay:.4s;}

.tt-main{display:flex;align-items:center;gap:12px;min-width:0;}
.tt-cover{
  width:40px;height:40px;border-radius:4px;object-fit:cover;flex-shrink:0;
  background:var(--bg-4);
}
.tt-textcol{min-width:0;}
.tt-title{
  font-size:14px;font-weight:600;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tt-artist{
  font-size:12.5px;color:var(--text-tertiary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-top:2px;
}
.tt-added{font-size:13px;color:var(--text-tertiary);}
.tt-duration{
  font-size:13px;color:var(--text-tertiary);
  display:flex;align-items:center;justify-content:flex-end;gap:14px;
}
.tt-like-btn{
  width:22px;height:22px;color:var(--text-tertiary);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .15s var(--ease), color .15s var(--ease), transform .12s var(--ease);
  position:relative;
}
.track-row:hover .tt-like-btn, .tt-like-btn.liked{opacity:1;}
.tt-like-btn.liked{color:var(--accent);}
.tt-like-btn:hover{transform:scale(1.15);}
.tt-like-btn svg{width:16px;height:16px;fill:currentColor;}
.tt-remove-btn{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-tertiary);opacity:0;
  transition:opacity .15s var(--ease), background .15s var(--ease), color .15s var(--ease);
}
.track-row:hover .tt-remove-btn{opacity:1;}
.tt-remove-btn:hover{background:var(--bg-hover);color:var(--danger);}
.tt-remove-btn svg{width:16px;height:16px;fill:currentColor;}

.like-burst{
  position:absolute;pointer-events:none;
  width:16px;height:16px;border:2px solid var(--accent);border-radius:50%;
  animation:likeBurst .5s ease-out forwards;
}

/* Empty playlist state */
.pl-empty-state{
  margin:40px 32px;padding:50px 20px;
  text-align:center;
  border:1px dashed var(--border);
  border-radius:var(--radius-lg);
  animation:fadeIn .4s var(--ease) both;
}
.pl-empty-state h3{font-size:20px;margin-bottom:8px;}
.pl-empty-state p{color:var(--text-tertiary);font-size:14px;margin-bottom:18px;}
.pl-empty-cta{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--text-primary);color:#000;
  padding:10px 22px;border-radius:999px;font-weight:700;font-size:14px;
  transition:transform .15s var(--ease), background .15s var(--ease);
}
.pl-empty-cta:hover{transform:scale(1.04);background:#e6e6e6;}

/* No-playlist-selected state (whole content) */
.no-selection{
  height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;color:var(--text-tertiary);text-align:center;padding:40px;
}
.no-selection svg{width:64px;height:64px;fill:var(--text-tertiary);opacity:.5;}
.no-selection h2{color:var(--text-secondary);font-size:20px;}
.no-selection .pl-empty-cta{margin-top:6px;}

/* ---------------- Player bar ---------------- */
.player-bar{
  height:var(--player-h);
  min-height:var(--player-h);
  background:var(--bg-1);
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:1fr minmax(0,720px) 1fr;
  align-items:center;
  padding:0 16px;
  gap:16px;
  z-index:60;
  transform:translateY(0);
  animation:slideUp .4s var(--ease) both;
}
.player-track{
  display:flex;align-items:center;gap:12px;min-width:0;
}
.player-cover{
  width:56px;height:56px;border-radius:6px;object-fit:cover;flex-shrink:0;
  background:var(--bg-4);
  box-shadow:0 4px 12px rgba(0,0,0,.4);
  transition:transform .2s var(--ease);
}
.player-cover.spin{animation:vinylSpin 8s linear infinite;border-radius:50%;}
.player-track-meta{min-width:0;}
.player-track-title{
  font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:260px;
}
.player-track-artist{
  font-size:12px;color:var(--text-tertiary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:260px;margin-top:2px;
}
.player-like{
  width:28px;height:28px;color:var(--text-tertiary);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:color .15s var(--ease), transform .12s var(--ease);
}
.player-like.liked{color:var(--accent);}
.player-like:hover{transform:scale(1.15);}
.player-like svg{width:16px;height:16px;fill:currentColor;}

.player-center{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  min-width:0;
}
.player-controls{display:flex;align-items:center;gap:20px;}
.pc-btn{
  color:var(--text-secondary);
  display:flex;align-items:center;justify-content:center;
  transition:color .15s var(--ease), transform .15s var(--ease);
}
.pc-btn:hover{color:var(--text-primary);transform:scale(1.1);}
.pc-btn.active{color:var(--accent);}
.pc-btn svg{width:16px;height:16px;fill:currentColor;}
.pc-play{
  width:34px;height:34px;border-radius:50%;background:var(--text-primary);
  display:flex;align-items:center;justify-content:center;
  color:#000;
  transition:transform .14s var(--ease), background .14s var(--ease);
}
.pc-play:hover{transform:scale(1.08);}
.pc-play:active{transform:scale(.94);}
.pc-play svg{width:16px;height:16px;fill:#000;margin-left:1px;}
.progress-row{
  display:flex;align-items:center;gap:8px;width:100%;
}
.time-label{font-size:11px;color:var(--text-tertiary);min-width:36px;text-align:center;font-variant-numeric:tabular-nums;}
.progress-track{
  flex:1;height:12px;display:flex;align-items:center;cursor:pointer;position:relative;
}
.progress-bg{
  width:100%;height:4px;border-radius:2px;background:var(--bg-4);position:relative;overflow:hidden;
}
.progress-fill{
  height:100%;background:var(--text-primary);border-radius:2px;width:0%;
  position:relative;
}
.progress-track:hover .progress-fill{background:var(--accent);}
.progress-handle{
  position:absolute;top:50%;width:12px;height:12px;border-radius:50%;
  background:var(--text-primary);transform:translate(-50%,-50%) scale(0);
  transition:transform .1s var(--ease);
  left:0%;
}
.progress-track:hover .progress-handle{transform:translate(-50%,-50%) scale(1);}

.player-right{
  display:flex;align-items:center;justify-content:flex-end;gap:14px;
}
.volume-row{display:flex;align-items:center;gap:8px;width:120px;}
.volume-track{flex:1;height:12px;display:flex;align-items:center;cursor:pointer;}
.volume-bg{width:100%;height:4px;border-radius:2px;background:var(--bg-4);position:relative;}
.volume-fill{height:100%;background:var(--text-primary);border-radius:2px;width:80%;}
.volume-track:hover .volume-fill{background:var(--accent);}

/* Loading overlay for buffering */
.buffer-spin{
  width:14px;height:14px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);border-top-color:var(--text-primary);
  animation:spin .7s linear infinite;
  display:none;
}
.pc-play.loading svg{display:none;}
.pc-play.loading .buffer-spin{display:block;}

/* ---------------- Toast ---------------- */
.toast{
  position:fixed;bottom:112px;left:50%;
  background:var(--text-primary);color:#000;
  padding:12px 20px;border-radius:8px;
  font-size:14px;font-weight:600;
  box-shadow:var(--shadow-lg);
  animation:toastIn .3s var(--ease) both;
  z-index:200;
}

/* ---------------- Modal ---------------- */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:flex;align-items:center;justify-content:center;
  z-index:300;
  animation:fadeIn .2s var(--ease) both;
}
.modal-card{
  width:420px;max-width:90vw;
  background:var(--bg-3);
  border-radius:var(--radius-lg);
  padding:24px;
  box-shadow:var(--shadow-lg);
  animation:popIn .25s var(--ease) both;
}
.modal-card h3{font-size:20px;margin-bottom:16px;}
.modal-card input{
  width:100%;background:var(--bg-1);border:1px solid var(--border);
  padding:12px 14px;border-radius:6px;font-size:14px;color:var(--text-primary);
  margin-bottom:16px;
  transition:border-color .15s var(--ease);
}
.modal-card input:focus{border-color:var(--text-primary);}
.modal-actions{display:flex;justify-content:flex-end;gap:12px;}
.modal-btn{
  padding:10px 20px;border-radius:999px;font-weight:700;font-size:14px;
  transition:transform .15s var(--ease), background .15s var(--ease);
}
.modal-btn.cancel{color:var(--text-secondary);}
.modal-btn.cancel:hover{color:var(--text-primary);}
.modal-btn.confirm{background:var(--accent);color:#000;}
.modal-btn.confirm:hover{background:var(--accent-hover);transform:scale(1.03);}
.modal-btn.danger{background:var(--danger);color:#fff;}
.modal-btn.danger:hover{transform:scale(1.03);}

/* responsive */
@media (max-width:820px){
  .sidebar{width:230px;min-width:230px;}
  .tt-head,.track-row{grid-template-columns:26px 1fr 46px;}
  .tt-added{display:none;}
  .player-track-title,.player-track-artist{max-width:120px;}
  .volume-row{display:none;}
}
</style>
</head>
<body>
<div id="app">

  <div class="topbar">
    <button class="nav-btn" id="backBtn" title="Back to SujalConnect">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <div class="topbar-title" id="topbarTitle">Playlists</div>
    <div class="topbar-actions">
      <button class="new-playlist-btn" id="newPlaylistBtn">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        New Playlist
      </button>
    </div>
  </div>

  <div class="main-layout">
    <div class="sidebar">
      <div class="sidebar-head"><h2>Your Playlists</h2></div>
      <div class="sidebar-list" id="sidebarList"></div>
    </div>

    <div class="content" id="content">
      <!-- populated dynamically -->
    </div>
  </div>

  <div class="player-bar">
    <div class="player-track" id="playerTrackInfo">
      <img class="player-cover" id="playerCover" src="" alt="" />
      <div class="player-track-meta">
        <div class="player-track-title" id="playerTitle">No song playing</div>
        <div class="player-track-artist" id="playerArtist">Pick a track to start</div>
      </div>
      <button class="player-like" id="playerLikeBtn" title="Like">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </button>
    </div>

    <div class="player-center">
      <div class="player-controls">
        <button class="pc-btn" id="shuffleBtn" title="Shuffle">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.42 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="pc-btn" id="prevBtn" title="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="pc-play" id="playBtn" title="Play">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <div class="buffer-spin"></div>
        </button>
        <button class="pc-btn" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="pc-btn" id="repeatBtn" title="Repeat">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span class="time-label" id="curTime">0:00</span>
        <div class="progress-track" id="progressTrack">
          <div class="progress-bg">
            <div class="progress-fill" id="progressFill"></div>
            <div class="progress-handle" id="progressHandle"></div>
          </div>
        </div>
        <span class="time-label" id="durTime">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button class="icon-btn" id="queueBtn" title="Queue">
        <svg viewBox="0 0 24 24"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
      </button>
      <div class="volume-row">
        <svg viewBox="0 0 24 24" width="16" height="16" style="fill:var(--text-secondary);flex-shrink:0;"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <div class="volume-track" id="volumeTrack">
          <div class="volume-bg"><div class="volume-fill" id="volumeFill"></div></div>
        </div>
      </div>
    </div>
  </div>

</div>

<audio id="audioEl" preload="auto"></audio>

<script>
const API = ""; // same-origin, served by server.py
const LS_KEY = "sujalconnect_playlists_v1";
const COVER_ACCENTS = [
  ["#1ed760","#0a5c2a"],["#e8115b","#5c0a2b"],["#f59b23","#5c380a"],
  ["#e13300","#521200"],["#509bf5","#0a2f5c"],["#af2896","#3d0e33"],
  ["#7d4dc9","#2d1a4a"],["#148a08","#052e02"]
];

/* ---------- State ---------- */
let state = {
  playlists: [],          // {id, name, desc, coverAccent:[c1,c2], songs:[songObj], likedIds:[]}
  activePlaylistId: null,
  queue: [],               // array of song objects currently playing (from active playlist)
  queueIndex: -1,
  isPlaying: false,
  shuffle: false,
  repeat: 'off',           // off | all | one
  likedSongIds: new Set(), // global liked set (per song id) for heart UI
  shuffleOrder: [],
};

/* ---------- Persistence ---------- */
function loadPlaylists(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state.playlists = parsed.playlists || [];
      state.likedSongIds = new Set(parsed.likedSongIds || []);
    }
  }catch(e){ console.warn("Failed to load playlists", e); }
  if(state.playlists.length === 0){
    state.playlists.push(makePlaylist("My Playlist #1", "Songs I love"));
  }
}
function savePlaylists(){
  localStorage.setItem(LS_KEY, JSON.stringify({
    playlists: state.playlists,
    likedSongIds: Array.from(state.likedSongIds),
  }));
}
function makePlaylist(name, desc=""){
  const accent = COVER_ACCENTS[Math.floor(Math.random()*COVER_ACCENTS.length)];
  return {
    id: 'pl_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name, desc,
    coverAccent: accent,
    songs: [],
    createdAt: Date.now(),
  };
}

/* ---------- Utility ---------- */
function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function showToast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 2200);
}
async function api(path){
  const res = await fetch(API + path);
  if(!res.ok) throw new Error('API error ' + res.status);
  return res.json();
}

/* ---------- Rendering: Sidebar ---------- */
function renderSidebar(){
  const list = document.getElementById('sidebarList');
  if(state.playlists.length === 0){
    list.innerHTML = `<div class="empty-sidebar">No playlists yet.<br>Create one to get started.</div>`;
    return;
  }
  list.innerHTML = state.playlists.map((pl,i) => {
    const cover = pl.songs[0]?.poster;
    const [c1,c2] = pl.coverAccent;
    const thumb = cover
      ? `<img src="${cover}" alt="" />`
      : `<div style="width:100%;height:100%;background:linear-gradient(135deg,${c1},${c2});display:flex;align-items:center;justify-content:center;">
           <svg viewBox="0 0 24 24" style="fill:rgba(255,255,255,.85);"><path d="M9 17V5l12-2v12M9 17c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3zm12-2c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"/></svg>
         </div>`;
    return `
    <div class="pl-item ${pl.id===state.activePlaylistId?'active':''}" data-id="${pl.id}" style="animation-delay:${i*30}ms">
      <div class="pl-thumb">${thumb}</div>
      <div class="pl-meta">
        <div class="pl-name">${escapeHtml(pl.name)}</div>
        <div class="pl-sub">${pl.songs.length} song${pl.songs.length===1?'':'s'}</div>
      </div>
      <button class="pl-item-menu" data-menu-id="${pl.id}" title="Delete playlist">
        <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
    </div>`;
  }).join('');

  list.querySelectorAll('.pl-item').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.pl-item-menu')) return;
      selectPlaylist(el.dataset.id);
    });
  });
  list.querySelectorAll('.pl-item-menu').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      confirmDeletePlaylist(el.dataset.menuId);
    });
  });
}

function escapeHtml(str=""){
  return str.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- Rendering: Content ---------- */
function getActivePlaylist(){
  return state.playlists.find(p=>p.id === state.activePlaylistId) || null;
}

function renderContent(){
  const content = document.getElementById('content');
  const pl = getActivePlaylist();
  document.getElementById('topbarTitle').textContent = pl ? pl.name : 'Playlists';

  if(!pl){
    content.style.setProperty('--hero-c1', '#181818');
    content.innerHTML = `
      <div class="no-selection">
        <svg viewBox="0 0 24 24"><path d="M9 17V5l12-2v12M9 17c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3zm12-2c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"/></svg>
        <h2>Select or create a playlist</h2>
        <button class="pl-empty-cta" id="emptyCreateBtn">Create Playlist</button>
      </div>`;
    document.getElementById('emptyCreateBtn').addEventListener('click', openCreateModal);
    return;
  }

  const [c1] = pl.coverAccent;
  content.style.setProperty('--hero-c1', c1 + '55');

  const totalMs = pl.songs.reduce((a,s)=>a+(s.duration||0),0);
  const totalMin = Math.round(totalMs/60);

  content.innerHTML = `
    <div class="content-inner">
      <div class="pl-hero">
        <div class="pl-hero-cover" id="heroCover">
          ${renderHeroCover(pl)}
        </div>
        <div class="pl-hero-info">
          <div class="pl-hero-type">Playlist</div>
          <h1 class="pl-hero-title" id="plTitleEdit" contenteditable="true" spellcheck="false">${escapeHtml(pl.name)}</h1>
          <div class="pl-hero-desc" id="plDescEdit" contenteditable="true" spellcheck="false">${escapeHtml(pl.desc || 'Add an optional description')}</div>
          <div class="pl-hero-sub">
            <b>You</b>
            ${pl.songs.length ? `<span class="dot"></span><span>${pl.songs.length} songs,</span><span>about ${totalMin} min</span>` : ''}
          </div>
        </div>
      </div>

      <div class="pl-actionbar">
        <button class="play-fab" id="plPlayFab" title="Play">
          <svg viewBox="0 0 24 24" id="plPlayFabIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="pl-action-icon small" id="shufflePlBtn" title="Shuffle play">
          <svg viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.42 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
        </button>
        <button class="pl-action-icon" id="downloadHintBtn" title="More">
          <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
      </div>

      <div class="pl-add-row">
        <div class="pl-search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input class="pl-search-input" id="songSearchInput" placeholder="Search songs to add..." autocomplete="off" />
          <div class="search-results-drop hidden" id="searchResultsDrop"></div>
        </div>
      </div>

      ${renderTrackTable(pl)}
    </div>
  `;

  wireContentEvents(pl);
}

function renderHeroCover(pl){
  const covers = pl.songs.slice(0,4).map(s=>s.poster).filter(Boolean);
  const [c1,c2] = pl.coverAccent;
  if(covers.length >= 4){
    return `<div class="cover-grid">${covers.slice(0,4).map(c=>`<img src="${c}" alt=""/>`).join('')}</div>`;
  } else if(covers.length > 0){
    return `<img src="${covers[0]}" style="width:100%;height:100%;object-fit:cover;" alt=""/>`;
  }
  return `<div class="cover-fallback"><svg viewBox="0 0 24 24"><path d="M9 17V5l12-2v12M9 17c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3zm12-2c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"/></svg></div>`;
}

function renderTrackTable(pl){
  if(pl.songs.length === 0){
    return `
      <div class="pl-empty-state">
        <h3>Let's find something for your playlist</h3>
        <p>Search for songs above to add them here.</p>
      </div>`;
  }
  const rows = pl.songs.map((s,i)=>{
    const isActive = state.activePlaylistId === pl.id && state.queueIndex >= 0 &&
                      state.queue[state.queueIndex] && state.queue[state.queueIndex].id === s.id;
    const liked = state.likedSongIds.has(s.id);
    return `
    <div class="track-row ${isActive?'active':''}" data-idx="${i}" data-id="${s.id}" style="animation-delay:${Math.min(i*20,300)}ms">
      <div class="tt-index">
        <span class="tt-index-num">${i+1}</span>
        <span class="tt-play-icon"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
        <span class="tt-eq"><span class="eq-bar" style="height:${isActive && state.isPlaying?'100%':'30%'}"></span><span class="eq-bar" style="height:${isActive && state.isPlaying?'70%':'30%'}"></span><span class="eq-bar" style="height:${isActive && state.isPlaying?'100%':'30%'}"></span></span>
      </div>
      <div class="tt-main">
        <img class="tt-cover" src="${s.poster||''}" alt="" onerror="this.style.visibility='hidden'"/>
        <div class="tt-textcol">
          <div class="tt-title">${escapeHtml(s.title)}</div>
          <div class="tt-artist">${escapeHtml(s.artist||'')}</div>
        </div>
      </div>
      <div class="tt-added">Recently added</div>
      <div class="tt-duration">
        <button class="tt-like-btn ${liked?'liked':''}" data-like-id="${s.id}" title="Like">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
        <span>${s.duration_str || fmtTime(s.duration||0)}</span>
      </div>
      <button class="tt-remove-btn" data-remove-idx="${i}" title="Remove from this playlist">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>`;
  }).join('');

  return `
    <div class="track-table">
      <div class="tt-head">
        <span>#</span><span>Title</span><span>Date added</span><span></span><span></span>
      </div>
      <div class="tt-body">${rows}</div>
    </div>`;
}

function wireContentEvents(pl){
  // hero title / desc editing
  const titleEl = document.getElementById('plTitleEdit');
  titleEl.addEventListener('blur', ()=>{
    const val = titleEl.textContent.trim() || 'Untitled Playlist';
    pl.name = val;
    savePlaylists();
    renderSidebar();
    document.getElementById('topbarTitle').textContent = pl.name;
  });
  titleEl.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); titleEl.blur(); } });

  const descEl = document.getElementById('plDescEdit');
  descEl.addEventListener('focus', ()=>{ if(!pl.desc) descEl.textContent=''; });
  descEl.addEventListener('blur', ()=>{
    pl.desc = descEl.textContent.trim();
    savePlaylists();
    if(!pl.desc) descEl.textContent = 'Add an optional description';
  });

  // play fab
  document.getElementById('plPlayFab').addEventListener('click', ()=>{
    if(pl.songs.length === 0) return;
    if(isCurrentPlaylistPlaying()){
      togglePlayPause();
    } else {
      playPlaylistFrom(pl, 0);
    }
  });
  updatePlayFabIcon();

  document.getElementById('shufflePlBtn').addEventListener('click', ()=>{
    if(pl.songs.length === 0) return;
    state.shuffle = true;
    const startIdx = Math.floor(Math.random()*pl.songs.length);
    playPlaylistFrom(pl, startIdx);
    showToast('Shuffle on');
  });

  // track rows
  document.querySelectorAll('.track-row').forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.tt-like-btn') || e.target.closest('.tt-remove-btn')) return;
      const idx = parseInt(row.dataset.idx,10);
      playPlaylistFrom(pl, idx);
    });
  });

  document.querySelectorAll('.tt-like-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      toggleLike(btn.dataset.likeId, btn);
    });
  });

  document.querySelectorAll('.tt-remove-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const idx = parseInt(btn.dataset.removeIdx,10);
      removeSongFromPlaylist(pl, idx);
    });
  });

  // search
  const searchInput = document.getElementById('songSearchInput');
  const drop = document.getElementById('searchResultsDrop');
  let searchTimer = null;
  searchInput.addEventListener('input', ()=>{
    clearTimeout(searchTimer);
    const q = searchInput.value.trim();
    if(!q){ drop.classList.add('hidden'); drop.innerHTML=''; return; }
    drop.classList.remove('hidden');
    drop.innerHTML = `<div class="sr-loading">Searching...</div>`;
    searchTimer = setTimeout(()=>runSongSearch(q, pl, drop), 350);
  });
  document.addEventListener('click', (e)=>{
    if(!e.target.closest('.pl-search-wrap')) drop.classList.add('hidden');
  });
}

async function runSongSearch(q, pl, drop){
  try{
    const data = await api(`/api/search?q=${encodeURIComponent(q)}&limit=12`);
    const results = data.results || [];
    if(results.length === 0){
      drop.innerHTML = `<div class="sr-empty">No songs found for "${escapeHtml(q)}"</div>`;
      return;
    }
    drop.innerHTML = results.map(s=>{
      const already = pl.songs.some(x=>x.id===s.id);
      return `
      <div class="sr-item ${already?'added':''}" data-song='${escapeAttr(JSON.stringify(s))}'>
        <img src="${s.poster||''}" alt="" onerror="this.style.visibility='hidden'"/>
        <div class="sr-meta">
          <div class="sr-title">${escapeHtml(s.title)}</div>
          <div class="sr-artist">${escapeHtml(s.artist||'')}</div>
        </div>
        <div class="sr-add-icon">
          <svg viewBox="0 0 24 24">${already
            ? '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>'
            : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>'}</svg>
        </div>
      </div>`;
    }).join('');
    drop.querySelectorAll('.sr-item').forEach(item=>{
      item.addEventListener('click', ()=>{
        const song = JSON.parse(item.dataset.song.replace(/&apos;/g,"'"));
        addSongToPlaylist(pl, song);
      });
    });
  }catch(e){
    drop.innerHTML = `<div class="sr-empty">Search failed. Try again.</div>`;
  }
}
function escapeAttr(str){ return str.replace(/'/g, '&apos;'); }

function addSongToPlaylist(pl, song){
  if(pl.songs.some(s=>s.id === song.id)){
    showToast('Already in this playlist');
    return;
  }
  pl.songs.push(song);
  savePlaylists();
  renderSidebar();
  renderContent();
  showToast(`Added to ${pl.name}`);
  // re-open search box focus after re-render
  const input = document.getElementById('songSearchInput');
  if(input) input.focus();
}

function removeSongFromPlaylist(pl, idx){
  const wasPlayingThis = state.activePlaylistId === pl.id && state.queue[state.queueIndex]?.id === pl.songs[idx]?.id;
  pl.songs.splice(idx,1);
  savePlaylists();
  renderSidebar();
  renderContent();
  if(wasPlayingThis) stopPlayback();
}

function confirmDeletePlaylist(id){
  const pl = state.playlists.find(p=>p.id===id);
  if(!pl) return;
  openModal({
    title: `Delete "${pl.name}"?`,
    body: `This can't be undone.`,
    confirmText: 'Delete',
    danger: true,
    onConfirm: ()=>{
      state.playlists = state.playlists.filter(p=>p.id!==id);
      if(state.activePlaylistId === id){
        state.activePlaylistId = state.playlists[0]?.id || null;
        if(state.queue.length && state.queue.some(s=>pl.songs.some(ps=>ps.id===s.id))){
          stopPlayback();
        }
      }
      savePlaylists();
      renderSidebar();
      renderContent();
    }
  });
}

/* ---------- Like handling ---------- */
function toggleLike(songId, btnEl){
  if(state.likedSongIds.has(songId)){
    state.likedSongIds.delete(songId);
    if(btnEl) btnEl.classList.remove('liked');
  } else {
    state.likedSongIds.add(songId);
    if(btnEl){
      btnEl.classList.add('liked');
      const burst = document.createElement('span');
      burst.className = 'like-burst';
      btnEl.appendChild(burst);
      setTimeout(()=>burst.remove(), 500);
    }
  }
  savePlaylists();
  updatePlayerLikeState();
}
function updatePlayerLikeState(){
  const cur = state.queue[state.queueIndex];
  const likeBtn = document.getElementById('playerLikeBtn');
  if(cur && state.likedSongIds.has(cur.id)) likeBtn.classList.add('liked');
  else likeBtn.classList.remove('liked');
}

/* ---------- Playback engine ---------- */
const audioEl = document.getElementById('audioEl');

function isCurrentPlaylistPlaying(){
  const pl = getActivePlaylist();
  if(!pl || state.queueIndex < 0) return false;
  return state.isPlaying && state.queue.length && pl.songs.some(s=>s.id === state.queue[state.queueIndex]?.id);
}

function playPlaylistFrom(pl, startIdx){
  state.queue = pl.songs.slice();
  state.queueIndex = startIdx;
  buildShuffleOrder();
  loadAndPlayCurrent();
}

function buildShuffleOrder(){
  state.shuffleOrder = state.queue.map((_,i)=>i);
  for(let i=state.shuffleOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [state.shuffleOrder[i],state.shuffleOrder[j]] = [state.shuffleOrder[j],state.shuffleOrder[i]];
  }
}

async function loadAndPlayCurrent(){
  const song = state.queue[state.queueIndex];
  if(!song) return;
  setBuffering(true);
  updatePlayerUI(song);
  try{
    const data = await api(`/api/stream/${encodeURIComponent(song.id)}`);
    const url = (data.playback_url || `/api/proxy-audio/${song.id}`);
    audioEl.src = API + url;
    await audioEl.play();
    state.isPlaying = true;
  }catch(e){
    console.error('Playback failed', e);
    showToast('Could not play this song');
    state.isPlaying = false;
  }
  setBuffering(false);
  updateAllPlayIcons();
  renderContent(); // to refresh active row highlighting / eq bars
}

function setBuffering(on){
  const playBtn = document.getElementById('playBtn');
  playBtn.classList.toggle('loading', on);
}

function togglePlayPause(){
  if(!state.queue.length) return;
  if(state.isPlaying){
    audioEl.pause();
    state.isPlaying = false;
  } else {
    audioEl.play().catch(()=>{});
    state.isPlaying = true;
  }
  updateAllPlayIcons();
  renderActiveRowState();
}

function stopPlayback(){
  audioEl.pause();
  audioEl.src = '';
  state.queue = [];
  state.queueIndex = -1;
  state.isPlaying = false;
  updatePlayerUI(null);
  updateAllPlayIcons();
}

function playNext(auto=false){
  if(!state.queue.length) return;
  if(state.repeat === 'one' && auto){
    audioEl.currentTime = 0;
    audioEl.play();
    return;
  }
  let nextIdx;
  if(state.shuffle){
    const posInShuffle = state.shuffleOrder.indexOf(state.queueIndex);
    if(posInShuffle === state.shuffleOrder.length - 1){
      if(state.repeat === 'all'){ nextIdx = state.shuffleOrder[0]; }
      else { state.isPlaying=false; updateAllPlayIcons(); return; }
    } else {
      nextIdx = state.shuffleOrder[posInShuffle + 1];
    }
  } else {
    nextIdx = state.queueIndex + 1;
    if(nextIdx >= state.queue.length){
      if(state.repeat === 'all'){ nextIdx = 0; }
      else { state.isPlaying=false; updateAllPlayIcons(); return; }
    }
  }
  state.queueIndex = nextIdx;
  loadAndPlayCurrent();
}

function playPrev(){
  if(!state.queue.length) return;
  if(audioEl.currentTime > 3){
    audioEl.currentTime = 0;
    return;
  }
  let prevIdx;
  if(state.shuffle){
    const posInShuffle = state.shuffleOrder.indexOf(state.queueIndex);
    prevIdx = posInShuffle <= 0 ? state.shuffleOrder[0] : state.shuffleOrder[posInShuffle - 1];
  } else {
    prevIdx = Math.max(0, state.queueIndex - 1);
  }
  state.queueIndex = prevIdx;
  loadAndPlayCurrent();
}

/* ---------- Player UI ---------- */
function updatePlayerUI(song){
  const cover = document.getElementById('playerCover');
  const title = document.getElementById('playerTitle');
  const artist = document.getElementById('playerArtist');
  if(!song){
    cover.src = '';
    cover.classList.remove('spin');
    title.textContent = 'No song playing';
    artist.textContent = 'Pick a track to start';
    document.getElementById('playerLikeBtn').classList.remove('liked');
    return;
  }
  cover.src = song.poster || '';
  title.textContent = song.title;
  artist.textContent = song.artist || '';
  updatePlayerLikeState();
}

function updateAllPlayIcons(){
  const playIcon = document.getElementById('playIcon');
  playIcon.innerHTML = state.isPlaying
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  document.getElementById('playerCover').classList.toggle('spin', state.isPlaying);
  updatePlayFabIcon();
  renderActiveRowState();
}

function updatePlayFabIcon(){
  const fabIcon = document.getElementById('plPlayFabIcon');
  const fab = document.getElementById('plPlayFab');
  if(!fabIcon) return;
  const playing = isCurrentPlaylistPlaying();
  fabIcon.innerHTML = playing
    ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  fab.classList.toggle('playing', playing);
}

function renderActiveRowState(){
  document.querySelectorAll('.track-row').forEach(row=>{
    const id = row.dataset.id;
    const cur = state.queue[state.queueIndex];
    const active = cur && cur.id === id && getActivePlaylist()?.songs.some(s=>s.id===id);
    row.classList.toggle('active', !!active);
    const eqBars = row.querySelectorAll('.eq-bar');
    eqBars.forEach((b,i)=>{
      b.style.animationPlayState = (active && state.isPlaying) ? 'running' : 'paused';
    });
  });
}

/* ---------- Audio element events ---------- */
audioEl.addEventListener('timeupdate', ()=>{
  if(!audioEl.duration) return;
  const pct = (audioEl.currentTime / audioEl.duration) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressHandle').style.left = pct + '%';
  document.getElementById('curTime').textContent = fmtTime(audioEl.currentTime);
  document.getElementById('durTime').textContent = fmtTime(audioEl.duration);
});
audioEl.addEventListener('ended', ()=> playNext(true));
audioEl.addEventListener('waiting', ()=> setBuffering(true));
audioEl.addEventListener('playing', ()=> setBuffering(false));
audioEl.addEventListener('pause', ()=>{ state.isPlaying = false; updateAllPlayIcons(); });
audioEl.addEventListener('play', ()=>{ state.isPlaying = true; updateAllPlayIcons(); });

/* ---------- Player controls wiring ---------- */
document.getElementById('playBtn').addEventListener('click', ()=>{
  if(!state.queue.length){
    const pl = getActivePlaylist();
    if(pl && pl.songs.length) playPlaylistFrom(pl, 0);
    return;
  }
  togglePlayPause();
});
document.getElementById('nextBtn').addEventListener('click', ()=>playNext(false));
document.getElementById('prevBtn').addEventListener('click', playPrev);
document.getElementById('shuffleBtn').addEventListener('click', (e)=>{
  state.shuffle = !state.shuffle;
  e.currentTarget.classList.toggle('active', state.shuffle);
  if(state.shuffle) buildShuffleOrder();
  showToast(state.shuffle ? 'Shuffle on' : 'Shuffle off');
});
document.getElementById('repeatBtn').addEventListener('click', (e)=>{
  state.repeat = state.repeat === 'off' ? 'all' : state.repeat === 'all' ? 'one' : 'off';
  e.currentTarget.classList.toggle('active', state.repeat !== 'off');
  e.currentTarget.title = state.repeat === 'one' ? 'Repeat one' : state.repeat === 'all' ? 'Repeat all' : 'Repeat';
  showToast('Repeat: ' + state.repeat);
});
document.getElementById('playerLikeBtn').addEventListener('click', (e)=>{
  const cur = state.queue[state.queueIndex];
  if(!cur) return;
  toggleLike(cur.id, null);
  e.currentTarget.classList.toggle('liked', state.likedSongIds.has(cur.id));
  renderContent();
});

const progressTrack = document.getElementById('progressTrack');
progressTrack.addEventListener('click', (e)=>{
  if(!audioEl.duration) return;
  const rect = progressTrack.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  audioEl.currentTime = pct * audioEl.duration;
});

const volumeTrack = document.getElementById('volumeTrack');
audioEl.volume = 0.8;
function setVolumeUI(v){ document.getElementById('volumeFill').style.width = (v*100)+'%'; }
setVolumeUI(0.8);
volumeTrack.addEventListener('click', (e)=>{
  const rect = volumeTrack.getBoundingClientRect();
  const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
  audioEl.volume = pct;
  setVolumeUI(pct);
});

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown', (e)=>{
  if(e.target.tagName === 'INPUT' || e.target.isContentEditable) return;
  if(e.code === 'Space'){ e.preventDefault(); document.getElementById('playBtn').click(); }
  if(e.code === 'ArrowRight' && e.shiftKey) playNext(false);
  if(e.code === 'ArrowLeft' && e.shiftKey) playPrev();
});

/* ---------- Playlist select / create ---------- */
function selectPlaylist(id){
  // Selecting a playlist only OPENS it (shows its song list) -- it must
  // never start audio playback on its own.
  state.activePlaylistId = id;
  const url = new URL(window.location.href);
  url.searchParams.set('id', id);
  window.history.replaceState({}, '', url);
  renderSidebar();
  renderContent();
}

document.getElementById('newPlaylistBtn').addEventListener('click', openCreateModal);
document.getElementById('backBtn').addEventListener('click', ()=>{
  window.location.href = 'index.html';
});

function openCreateModal(){
  openModal({
    title: 'Create playlist',
    inputPlaceholder: 'My Playlist #' + (state.playlists.length + 1),
    confirmText: 'Create',
    onConfirm: (value)=>{
      const name = (value && value.trim()) || ('My Playlist #' + (state.playlists.length + 1));
      const pl = makePlaylist(name);
      state.playlists.unshift(pl);
      state.activePlaylistId = pl.id;
      savePlaylists();
      renderSidebar();
      renderContent();
      showToast('Playlist created');
    }
  });
}

/* ---------- Generic modal ---------- */
function openModal({title, body, inputPlaceholder, confirmText='Confirm', danger=false, onConfirm}){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal-card">
      <h3>${escapeHtml(title)}</h3>
      ${body ? `<p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px;">${escapeHtml(body)}</p>` : ''}
      ${inputPlaceholder !== undefined ? `<input type="text" id="modalInput" placeholder="${escapeHtml(inputPlaceholder)}" />` : ''}
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancel">Cancel</button>
        <button class="modal-btn ${danger?'danger':'confirm'}" id="modalConfirm">${escapeHtml(confirmText)}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  const input = backdrop.querySelector('#modalInput');
  if(input){ setTimeout(()=>input.focus(), 50); }
  function close(){ backdrop.style.opacity='0'; setTimeout(()=>backdrop.remove(), 150); }
  backdrop.addEventListener('click', (e)=>{ if(e.target === backdrop) close(); });
  backdrop.querySelector('#modalCancel').addEventListener('click', close);
  backdrop.querySelector('#modalConfirm').addEventListener('click', ()=>{
    onConfirm(input ? input.value : undefined);
    close();
  });
  if(input){
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ onConfirm(input.value); close(); }
      if(e.key === 'Escape') close();
    });
  }
}

/* ---------- Init ---------- */
function init(){
  loadPlaylists();

  // If we were navigated here with ?id=<playlistId> (e.g. from index.html's
  // "Your Library" list, or a freshly created playlist), open that playlist
  // directly instead of defaulting to the first one in the list.
  const params = new URLSearchParams(window.location.search);
  const requestedId = params.get('id');
  if(requestedId && state.playlists.some(p => p.id === requestedId)){
    state.activePlaylistId = requestedId;
  } else if(!state.activePlaylistId && state.playlists.length){
    state.activePlaylistId = state.playlists[0].id;
  }

  renderSidebar();
  renderContent();
}
init();
</script>
